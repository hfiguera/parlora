name: Blog
on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/blog.yml']
  pull_request:
    paths: ['website/**', '.github/workflows/blog.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: blog-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify preview and production builds
        run: |
          python3 -m unittest discover -s website -p 'test_*.py'
          node --check website/assets/site.js
          python3 website/build.py --base-path /parlora/ --analytics
      - name: Upload static publication
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/_site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy publication
        id: deployment
        uses: actions/deploy-pages@v4
