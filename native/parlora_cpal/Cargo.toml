[package]
name = "parlora_cpal"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
[lib]
crate-type = ["cdylib"]
[dependencies]
rustler = "=0.38.0"
cpal = "=0.18.2"
crossbeam-queue = "=0.3.14"
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "=0.18.2", features = ["pulseaudio"] }
[profile.release]
panic = "unwind"
